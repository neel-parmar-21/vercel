<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="container">

    <header class="navbar">
      <div class="logo">travel.</div>
      <div class="sub-title">CARD SLIDER FOR WORDPRESS</div>
      <nav class="nav-links">
        <a href="#">ABOUT</a>
        <a href="#">CONTACT</a>
      </nav>
    </header>


    <main class="content">
      

      <section class="hero-section">
        <h1>Must see<br>Places</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin elementum metus eu enim rhoncus posuere.</p>
        <button class="btn-explore">Explore</button>
      </section>


      <section class="slider-section">
        <div class="card-container">
          

          <div class="card">
            <img src="https://images.unsplash.com/photo-1641128324972-af3212f0f6bd?auto=format&fit=crop&w=600&q=80" alt="Cappadocia">
            <div class="card-overlay">
              <h3>Cappadocia</h3>
              <p><i class="fa-solid fa-location-dot"></i> TURKEY</p>
            </div>
          </div>


          <div class="card">
            <img src="https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=600&q=80" alt="Santorini">
            <div class="card-overlay">
              <h3>Santorini</h3>
              <p><i class="fa-solid fa-location-dot"></i> GREECE</p>
            </div>
          </div>


          <div class="card">
            <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=600&q=80" alt="Bali">
            <div class="card-overlay">
              <h3>Bali</h3>
              <p><i class="fa-solid fa-location-dot"></i> INDONESIA</p>
            </div>
          </div>

        </div>
      </section>

    </main>

    <footer class="footer">
      <div class="social-icons">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
        <a href="#"><i class="fa-solid fa-globe"></i></a>
      </div>

      <div class="footer-center">
        <span>UNIQUE DESTINATIONS</span>
      </div>

      <div class="footer-controls">
        <span class="pagination">01 / 03</span>
        <div class="arrow-buttons">
          <button class="btn-arrow" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn-arrow" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
